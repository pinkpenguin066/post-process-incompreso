[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "post-process-incompreso"
version = "0.1.0"
description = "Post-processing package for incompressible fluid flow and body dynamics simulations."
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.3.0",
    "scipy>=1.5.0",
    "pandas>=1.2.0",
    "imageio>=2.9.0",
    "imageio[ffmpeg]>=2.9.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["post_process_incompreso*"]